name: Build FunASR Runtime GPU Image

# 触发条件：推送到自定义分支（如 feature/gpu-build）时触发
on:
  push:
    branches: [ "feature/gpu-build" ]
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-20.04 # 官方推荐 Ubuntu 20.04
    permissions:
      contents: read
      packages: write # 用于推送镜像到 GitHub Packages

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GPU image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./runtime/docker/Dockerfile.gpu # 自定义 Dockerfile 路径
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/funasr:funasr-runtime-sdk-gpu-0.2.1
          build-args: |
            ONNXRUNTIME_URL=https://github.com/microsoft/onnxruntime/releases/download/v1.14.0/onnxruntime-linux-x64-gpu-1.14.0.tgz
            FFMPEG_URL=https://isv-data.oss-cn-hangzhou.aliyuncs.com/ics/MaaS/ASR/dep_libs/ffmpeg-master-latest-linux64-gpl-shared.tar.xz
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 启用 GPU 支持（需配合 Dockerfile 中的 CUDA 基础镜像）
          platforms: linux/amd64